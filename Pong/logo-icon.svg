<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @keyframes neonGlow {
        0%, 100% { filter: drop-shadow(0 0 8px #00d4ff) drop-shadow(0 0 20px rgba(0, 212, 255, 0.6)); }
        50% { filter: drop-shadow(0 0 15px #00d4ff) drop-shadow(0 0 30px rgba(0, 212, 255, 0.9)); }
      }
      .neon { animation: neonGlow 2s infinite; }
    </style>
    <linearGradient id="cyanGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0099cc;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="pinkGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff006e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#cc0055;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="200" height="200" fill="#0a0a0a"/>

  <!-- Center Line -->
  <line x1="100" y1="30" x2="100" y2="170" stroke="#00d4ff" stroke-width="2" opacity="0.5" stroke-dasharray="4,6"/>

  <!-- Left Paddle -->
  <rect x="30" y="70" width="15" height="60" rx="7" fill="url(#cyanGradient)" stroke="#00d4ff" stroke-width="2"/>

  <!-- Right Paddle -->
  <rect x="155" y="70" width="15" height="60" rx="7" fill="url(#pinkGradient)" stroke="#ff006e" stroke-width="2"/>

  <!-- Ball -->
  <g class="neon">
    <circle cx="100" cy="100" r="10" fill="#00d4ff"/>
    <circle cx="100" cy="100" r="10" fill="none" stroke="#ff006e" stroke-width="2"/>
  </g>

</svg>
