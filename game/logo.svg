<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @keyframes neonGlow {
        0%, 100% { filter: drop-shadow(0 0 8px #00d4ff) drop-shadow(0 0 20px rgba(0, 212, 255, 0.6)); }
        50% { filter: drop-shadow(0 0 15px #00d4ff) drop-shadow(0 0 30px rgba(0, 212, 255, 0.9)); }
      }
      @keyframes slide {
        0%, 100% { transform: translateX(-5px); }
        50% { transform: translateX(5px); }
      }
      .neon { animation: neonGlow 2s infinite; }
      .paddle-left { animation: slide 2s infinite; }
      .paddle-right { animation: slide 2s infinite reverse; }
    </style>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a2e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="cyanGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0099cc;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="pinkGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff006e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#cc0055;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background Circle -->
  <circle cx="100" cy="100" r="95" fill="url(#bgGradient)" stroke="#00d4ff" stroke-width="2" opacity="0.8"/>
  
  <!-- Outer Glow Ring -->
  <circle cx="100" cy="100" r="95" fill="none" stroke="#ff006e" stroke-width="1" opacity="0.3" stroke-dasharray="5,5"/>

  <!-- Center Line -->
  <line x1="100" y1="30" x2="100" y2="170" stroke="#00d4ff" stroke-width="1" opacity="0.4" stroke-dasharray="4,6"/>

  <!-- Left Paddle (Player 1) - Cyan -->
  <g class="paddle-left neon">
    <rect x="25" y="65" width="12" height="70" rx="6" fill="url(#cyanGradient)" stroke="#00d4ff" stroke-width="1.5"/>
    <rect x="25" y="65" width="12" height="70" rx="6" fill="none" stroke="#00d4ff" stroke-width="1" opacity="0.6"/>
  </g>

  <!-- Right Paddle (Player 2) - Pink -->
  <g class="paddle-right neon">
    <rect x="163" y="65" width="12" height="70" rx="6" fill="url(#pinkGradient)" stroke="#ff006e" stroke-width="1.5"/>
    <rect x="163" y="65" width="12" height="70" rx="6" fill="none" stroke="#ff006e" stroke-width="1" opacity="0.6"/>
  </g>

  <!-- Ball -->
  <g class="neon">
    <circle cx="100" cy="100" r="8" fill="#00d4ff" opacity="0.9"/>
    <circle cx="100" cy="100" r="8" fill="none" stroke="#ff006e" stroke-width="2" opacity="0.7"/>
    <circle cx="100" cy="100" r="12" fill="none" stroke="#00d4ff" stroke-width="1" opacity="0.3"/>
  </g>

  <!-- Motion Lines (Ball Trail) -->
  <g opacity="0.5">
    <line x1="70" y1="100" x2="85" y2="100" stroke="#00d4ff" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="115" y1="100" x2="130" y2="100" stroke="#ff006e" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Accent Dots -->
  <circle cx="35" cy="45" r="2.5" fill="#00d4ff" opacity="0.6"/>
  <circle cx="165" cy="155" r="2.5" fill="#ff006e" opacity="0.6"/>
  <circle cx="165" cy="45" r="2" fill="#ff006e" opacity="0.4"/>
  <circle cx="35" cy="155" r="2" fill="#00d4ff" opacity="0.4"/>

  <!-- Top Text Arc (optional decorative) -->
  <defs>
    <path id="topArc" d="M 60,100 A 40,40 0 0,1 140,100" fill="none"/>
  </defs>

</svg>
